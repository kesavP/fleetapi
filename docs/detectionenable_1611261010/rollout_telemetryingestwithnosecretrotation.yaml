DOCKER_REGISTRY    ?= grandnodeacr4215.azurecr.io
IMAGE_TAG          ?= v1
RG=

az account set --subscription "f1b3e3ac-a5b4-40ab-b510-19d752cb49ef"

az aks get-credentials --resource-group grandnode-rg --name grandnode-aks1

 helm template hub deploy/platform-mvp/chart/hub-services -n monitoring -f docs/detectionenable/hub-azure.yaml \
  --show-only templates/telemetry-ingest.yaml \
  | awk 'BEGIN{RS="\n---\n";ORS="\n---\n"} !/(^|\n)kind: Secret\n/' > docs/detectionenable/hub-nosecret-v2.yaml
  
kubectl diff -f hub-nosecret-v2.yaml

kubectl apply -f hub-nosecret-v2.yaml

kubectl -n monitoring get deploy telemetry-ingest -o jsonpath='{.spec.template.spec.containers[0].args}' | tr ',' '\n' | grep -i detect

kubectl -n monitoring get pods -l app=telemetry-ingest
kubectl -n monitoring rollout status deploy/telemetry-ingest


apply new telemetry-ingest
--------------------------
az acr login -n grandnodeacr4215 [to push a new image]

 docker run --rm grandnodeacr4215.azurecr.io/telemetry-ingest:v3 --projects-file=/nope --detect-interval=1m 2>&1 | head -2
 
 >> no projects means the detection is on
 
 apply yaml with new image and no secrets
 helm template hub deploy/platform-mvp/chart/hub-services -n monitoring \
  -f docs/detectionenable/hub-azure.yaml --set telemetryIngest.image.tag=v3 \
  --show-only templates/telemetry-ingest.yaml \
  | awk 'BEGIN{RS="\n---\n";ORS="\n---\n"} !/(^|\n)kind: Secret\n/' > docs/detectionenable/hub-nosecret-ingestv3.yaml
  
  grep -c "kind: Secret" docs/detectionenable/hub-nosecret-ingestv3.yaml >>> should be 0
  
  kubectl apply -f docs/detectionenable/hub-nosecret-ingestv3.yaml
  kubectl -n monitoring rollout status deploy/telemetry-ingest >> should successfully rollout
  kubectl -n monitoring get deploy telemetry-ingest -o jsonpath='{.spec.template.spec.containers[0].args}' | tr ',' '\n' | grep detect >> should show detect args
  
  Check the running pods, service,statefulsets
  kubectl -n grandnode get deploy,sts,svc
  
  
  
  