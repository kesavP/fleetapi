# Source: hub-services/templates/telemetry-ingest.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-ingest
  namespace: monitoring
  labels:
    app: telemetry-ingest
spec:
  # The service holds batches in memory until they are inserted; scale it out
  # only after deciding how a restart should treat the rows in flight.
  replicas: 1
  selector:
    matchLabels:
      app: telemetry-ingest
  template:
    metadata:
      labels:
        app: telemetry-ingest
    spec:
      serviceAccountName: telemetry-ingest
      automountServiceAccountToken: false
      volumes:
        - name: projects
          secret:
            secretName: telemetry-ingest-keys
            items:
              - key: projects.json
                path: projects.json
        - name: clickhouse-password
          secret:
            secretName: telemetry-clickhouse
        - name: anthropic-key
          secret:
            secretName: anthropic-api-key
            items:
              - key: apiKey
                path: key
      containers:
        - name: telemetry-ingest
          image: "grandnodeacr4215.azurecr.io/telemetry-ingest:v5"
          imagePullPolicy: Always
          args:
            - --listen=:8080
            - --grpc-listen=:4317
            - --projects-file=/etc/telemetry/projects/projects.json
            - --clickhouse-addr=telemetry-clickhouse.monitoring.svc.cluster.local:9000
            - --clickhouse-user=telemetry
            - --clickhouse-password-file=/etc/telemetry/clickhouse/password
            - --ttl-metrics=336h
            - --ttl-traces=168h
            - --ttl-logs=168h
            - --ttl-profiles=168h
            - --analysis-key-file=/etc/telemetry/anthropic/key
            - --analysis-model=claude-opus-5-5
            - --detect-interval=1m
            - --detect-lookback=3h
            - --detect-max-age=30m
            - --detect-availability=0.999
            - --detect-latency=0.999
            - --detect-latency-seconds=0.5
            - --detect-burn=14.4
            - --detect-silence-after=5m
            - "--detect-silence-exclude=^(kube-|gke-|gmp-|gatekeeper|config-management|istio-system$|asm-|anthos|cert-manager$|ingress-nginx$|linkerd|calico|tigera|cilium|flux-system$|argocd$|olm$)"
            - --detect-deps
            - --detect-deps-share=0.2
            - --detect-deps-min-failed=5
            - "--detect-deps-exclude=^(kube-|gke-|gmp-|gatekeeper|config-management|istio-system$|asm-|anthos|cert-manager$|ingress-nginx$|linkerd|calico|tigera|cilium|flux-system$|argocd$|olm$)"
          ports:
            - name: http
              containerPort: 8080
            - name: otlp-grpc
              containerPort: 4317
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: projects
              mountPath: /etc/telemetry/projects
              readOnly: true
            - name: clickhouse-password
              mountPath: /etc/telemetry/clickhouse
              readOnly: true
            - name: anthropic-key
              mountPath: /etc/telemetry/anthropic
              readOnly: true
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 64Mi


---
# Source: hub-services/templates/telemetry-ingest.yaml
# One ClickHouse replica: enough for a lab, and the tables are not replicated.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: telemetry-clickhouse
  namespace: monitoring
  labels:
    app: telemetry-clickhouse
spec:
  serviceName: telemetry-clickhouse
  replicas: 1
  selector:
    matchLabels:
      app: telemetry-clickhouse
  template:
    metadata:
      labels:
        app: telemetry-clickhouse
    spec:
      containers:
        - name: clickhouse
          image: "clickhouse/clickhouse-server:24.8"
          imagePullPolicy: IfNotPresent
          env:
            - name: CLICKHOUSE_USER
              value: telemetry
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: telemetry-clickhouse
                  key: password
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
          ports:
            - name: native
              containerPort: 9000
            - name: http
              containerPort: 8123
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
            requests:
              cpu: 100m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 50Gi



