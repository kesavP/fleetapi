# Source: hub-services/templates/telemetry-ingest.yaml
# How the spokes' agents reach the service. Inside this cluster the name
# telemetry-ingest.<namespace>.svc always works. For other clusters set
# service.type: NodePort on the kind lab (spokes use
# http://hub-control-plane:<nodePort>), LoadBalancer on a cloud (with the
# provider's annotation for an internal one). The query API is on the same port,
# so whoever can reach the ingest endpoint can also try the read endpoints: the
# keys are the only protection, and the traffic is plain HTTP. Keep it on a
# private network, and restrict it with loadBalancerSourceRanges where the
# provider supports that.
apiVersion: v1
kind: Service
metadata:
  name: telemetry-ingest
  namespace: monitoring
  labels:
    app: telemetry-ingest
spec:
  type: ClusterIP
  selector:
    app: telemetry-ingest
  ports:
    - name: http
      port: 80
      targetPort: http
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc


---

# Source: hub-services/templates/telemetry-ingest.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-ingest
  namespace: monitoring
  labels:
    app: telemetry-ingest
spec:
  # The service holds batches in memory until they are inserted; scale it out
  # only after deciding how a restart should treat the rows in flight.
  replicas: 1
  selector:
    matchLabels:
      app: telemetry-ingest
  template:
    metadata:
      labels:
        app: telemetry-ingest
    spec:
      serviceAccountName: telemetry-ingest
      automountServiceAccountToken: false
      volumes:
        - name: projects
          secret:
            secretName: telemetry-ingest-keys
            items:
              - key: projects.json
                path: projects.json
        - name: clickhouse-password
          secret:
            secretName: telemetry-clickhouse
      containers:
        - name: telemetry-ingest
          image: "us-central1-docker.pkg.dev/fleetapi-513707/k8-pods-images/telemetry-ingest:v19"
          imagePullPolicy: Always
          args:
            - --listen=:8080
            - --grpc-listen=:4317
            - --projects-file=/etc/telemetry/projects/projects.json
            - --clickhouse-addr=telemetry-clickhouse.monitoring.svc.cluster.local:9000
            - --clickhouse-user=telemetry
            - --clickhouse-password-file=/etc/telemetry/clickhouse/password
            - --ttl-metrics=336h
            - --ttl-traces=168h
            - --ttl-logs=168h
            - --ttl-profiles=168h
            - --storage-policy=tiered
            - --cold-volume=cold
            - --cold-after=48h
          ports:
            - name: http
              containerPort: 8080
            - name: otlp-grpc
              containerPort: 4317
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: projects
              mountPath: /etc/telemetry/projects
              readOnly: true
            - name: clickhouse-password
              mountPath: /etc/telemetry/clickhouse
              readOnly: true
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 50m
              memory: 64Mi


