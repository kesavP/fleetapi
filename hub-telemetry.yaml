# Source: hub-services/templates/telemetry-ingest.yaml
# One ClickHouse replica: enough for a lab, and the tables are not replicated.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: telemetry-clickhouse
  namespace: monitoring
  labels:
    app: telemetry-clickhouse
spec:
  serviceName: telemetry-clickhouse
  replicas: 1
  selector:
    matchLabels:
      app: telemetry-clickhouse
  template:
    metadata:
      labels:
        app: telemetry-clickhouse
      annotations:
        # A change to the storage configuration restarts ClickHouse, which reads it only at start.
        checksum/storage: 57c5b25e25ef6178ebc5811ecf0882f1c58b5289030c6a21e73d28e494b47a8c
    spec:
      volumes:
        - name: storage-config
          configMap:
            name: telemetry-clickhouse-storage
      containers:
        - name: clickhouse
          image: "clickhouse/clickhouse-server:24.8"
          imagePullPolicy: IfNotPresent
          env:
            - name: CLICKHOUSE_USER
              value: telemetry
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: telemetry-clickhouse
                  key: password
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
            - name: GCS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: telemetry-gcs
                  key: accessKeyId
            - name: GCS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: telemetry-gcs
                  key: secretAccessKey
          ports:
            - name: native
              containerPort: 9000
            - name: http
              containerPort: 8123
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: storage-config
              mountPath: /etc/clickhouse-server/config.d/storage.xml
              subPath: storage.xml
              readOnly: true
          resources:
            limits:
              cpu: "1"
              memory: 2Gi
            requests:
              cpu: 100m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi


