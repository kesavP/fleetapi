# Included in every location that sets headers: nginx drops the server-level add_header lines in a location
# that has an add_header of its own, so they are repeated here rather than inherited.
#
# The page holds a read key while it is open, so the policy is strict: scripts, styles and requests only
# from this origin, and nothing may frame it. If a later view needs more (an inline style from a chart
# library, say) loosen the one directive, here, and record why.
add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
