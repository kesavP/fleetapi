# Hub Services — controllers that depend on infrastructure (Dex, cert-manager)
# Release name: hub-services (or whatever you choose)

dex:
  # Dex issuer URL — must match the Dex deployment in the infrastructure chart
  issuer: "https://bm4080.taildf7067.ts.net/dex"

# Spoke clusters registered on the hub. Each needs a <name>-kubeconfig Secret
# (server + CA) and a projected <name>-token in the controllers that engage it
# (see spokeTokens). Labels let a controller engage only the clusters it serves.
fleet:
  # apiURL is the address the hub reaches the spoke API at; it defaults to
  # https://<name>-control-plane:6443, the kind address the controllers use.
  # Spoke API probes (spokeProbes below) check it.
  clusters:
    - name: us
      displayName: "US Cluster"
    - name: eu
      displayName: "EU Cluster"
      labels:
        platform.example.com/offers-vms: "true"

# VmSet service (VM tiers). Tier names become the allowed `size` values.
vmSet:
  tiers:
    S: { cpu: 1, memory: 1Gi }
    M: { cpu: 2, memory: 2Gi }
  defaultSize: S
  maxReplicas: 3
  image: quay.io/kubevirt/cirros-container-disk-demo:v1.9.1
  guestUser: cirros
  # Printed to the VM's serial console once cloud-init has run; used by tests.
  cloudInitMarker: platform-cloudinit-ok
  # Restricts sshPublicKey to key types/characters that cannot break out of the
  # single-quoted shell line in the generated user-data.
  sshPublicKeyPattern: "^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp256) [A-Za-z0-9+/=]+( [A-Za-z0-9@._-]+)?$"

# Places VmSet requests on VM-capable spokes as KubeVirt VMs.
vmBindingController:
  enabled: true
  replicas: 1
  image:
    repository: sojoner/vm-binding-controller
    tag: dev
    pullPolicy: Always
  # Numeric UID of the distroless `nonroot` user; kubelet cannot verify the name.
  runAsUser: 65532
  # Only ClusterProfiles carrying these labels are engaged (see fleet.clusters).
  clusterSelector: "platform.example.com/offers-vms=true"
  runStrategy: Always
  requeueInterval: 30s
  pollInterval: 10s
  defaultNamespace: default
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }
  # One projected token per VM-capable spoke; path must be <clusterName>-token.
  spokeTokens:
    - serviceAccountToken:
        path: eu-token
        audience: homelab:eu-spoke
        expirationSeconds: 3600

# HTTP API in front of VmSet. Callers send their own bearer token, which is
# forwarded to the hub API server, so RBAC on vmsets stays the only access
# control. Off by default until the image is built.
vmSetGateway:
  enabled: false
  replicas: 2
  image:
    repository: sojoner/vmset-gateway
    tag: dev
    pullPolicy: Always
  # Numeric UID of the distroless `nonroot` user.
  runAsUser: 65532
  # Plural resource name Kro generated for VmSet; confirm with
  # `kubectl api-resources | grep platform.example.com`.
  resource: vmsets
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

# Webhook receiver for Alertmanager. On by default because Alertmanager (see
# the infrastructure chart) always sends to it; the image must be built and
# pushed first (`make build-alert-router-image push-alert-router`).
alertRouter:
  enabled: true
  image:
    repository: sojoner/alert-router
    tag: dev
    pullPolicy: Always
  # Numeric UID of the distroless `nonroot` user.
  runAsUser: 65532
  # An unchanged firing alert is not forwarded again within this interval.
  # Resolutions always pass, and an alert that fires again after resolving
  # notifies again.
  dedupeInterval: 10m
  sinkTimeout: 5s
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 100m, memory: 64Mi }

# Telemetry store for the Coroot agents' data (metrics, traces, logs, profiles):
# receives it from the spokes, keeps it in ClickHouse, serves it per project.
# Off by default. One project per fleet cluster; the chart generates an ingest
# key (agents) and a read key (query API) for each into Secret
# telemetry-ingest-keys (`<cluster>.ingest`, `<cluster>.read`). The image must be
# built and pushed first (`make build-telemetry-ingest-image push-telemetry-ingest`).
# Plain HTTP, like the metrics ingest: keep it on the lab's private network.
telemetryIngest:
  enabled: false
  namespace: monitoring
  image:
    repository: sojoner/telemetry-ingest
    tag: dev
    pullPolicy: Always
  # Numeric UID of the distroless `nonroot` user.
  runAsUser: 65532
  retention:
    metrics: 336h
    traces: 168h
    logs: 168h
    profiles: 168h
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 512Mi }
  # How the spokes' agents reach the service (it always has the in-cluster name
  # telemetry-ingest.<namespace>.svc). ClusterIP: this cluster only. NodePort:
  # the kind lab, where spokes use http://hub-control-plane:<nodePort> over the
  # Docker network (30080, 30317 and 30909 are taken by Coroot and the metrics
  # ingest). LoadBalancer: a cloud; use the provider's annotation for an
  # internal one, for example on GKE
  #   networking.gke.io/load-balancer-type: "Internal"
  # and add networking.gke.io/internal-load-balancer-allow-global-access: "true"
  # if the spoke is in another region. Plain HTTP and one port for both ingest and
  # the query API: keep it private and restrict who can reach it.
  service:
    type: ClusterIP
    nodePort: 30081
    grpcNodePort: 30318
    annotations: {}
    loadBalancerSourceRanges: []
  # A ServiceMonitor for the service's /metrics. It needs the Prometheus Operator
  # CRDs (the kind lab has them); set false on a cluster without them, such as a
  # plain GKE cluster, or the apply fails on that one object.
  serviceMonitor:
    enabled: true
  # A single replica; the tables are not replicated.
  clickhouse:
    image:
      repository: clickhouse/clickhouse-server
      tag: "24.8"
      pullPolicy: IfNotPresent
    storage: 5Gi
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { cpu: "1", memory: 2Gi }

# The telemetry UI (platform-mvp/telemetry-ui): a static app plus a proxy of the
# read API, in nginx. Build and push the image first
# (`make build-telemetry-ui-image push-telemetry-ui`). It holds no key: the user
# enters a project and its read key in the page. Reach it with
#   kubectl -n monitoring port-forward svc/telemetry-ui 8081:80
# or set service.type for a private address, as for telemetryIngest.service.
# Plain HTTP; the read key crosses it, so keep it private or put TLS in front.
telemetryUi:
  enabled: false
  namespace: monitoring
  replicas: 1
  image:
    repository: sojoner/telemetry-ui
    tag: dev
    pullPolicy: Always
  # Numeric UID of the nginx-unprivileged image's user.
  runAsUser: 101
  # Where /api is proxied (scheme and host, no path). Empty: the telemetry-ingest Service.
  apiUpstream: ""
  # Where the alerts path goes. Empty: the telemetry-alerts Service.
  alertsUpstream: ""
  service:
    type: ClusterIP
    nodePort: 30082
    annotations: {}
    loadBalancerSourceRanges: []
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 200m, memory: 64Mi }

# The alert service (platform-mvp/telemetry-ui, Dockerfile.alerts): checks every project for services that are not serving, with
# nobody looking, and serves the result to the UI at /api/v1/projects/<project>/alerts (same read keys). It reads the project
# list and read keys from the telemetry-ingest-keys Secret, so it must run in the same namespace as telemetryIngest. Build and push
# the image first (`make build-telemetry-alerts-image push-telemetry-alerts`). Optional: tell an Alertmanager as well.
telemetryAlerts:
  enabled: false
  namespace: monitoring
  image:
    repository: sojoner/telemetry-alerts
    tag: dev
    pullPolicy: Always
  # Numeric UID of the node image's non-root user.
  runAsUser: 1000
  # Empty: the telemetry-ingest Service.
  readApi: ""
  intervalSeconds: 60
  # Where to post firing alerts, for example http://hub-kube-prometheus-stack-alertmanager.monitoring.svc:9093 (check the name
  # with `kubectl -n monitoring get svc`). Empty: not posted; the UI and /metrics still have them.
  alertmanagerUrl: ""
  # Thresholds that differ from the defaults, for example {errorShare: 10, baselineSeconds: 7200}. See alerts/rules.js.
  thresholds: {}
  # Alert state is kept in a file so a restart does not forget what is firing. An emptyDir survives a container restart but not
  # a new pod; a volume survives both.
  persistence:
    enabled: false
    size: 100Mi
    storageClassName: ""
  # A ServiceMonitor for /metrics. Needs the Prometheus Operator CRDs; leave off on a cluster without them.
  serviceMonitor:
    enabled: false
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { cpu: 300m, memory: 192Mi }

# Receives the spokes' pod metrics. Each spoke runs a Prometheus agent that
# remote-writes here; this proxy is the only way in, so the hub Prometheus is
# never exposed. Basic auth with a generated credential (kept on upgrades);
# copy it to each spoke with `make spoke-metrics-credentials`.
# Traffic is plain HTTP, which is only acceptable on the lab's private Docker
# network: terminate TLS in front of it anywhere else.
metricsIngest:
  enabled: true
  image:
    repository: nginxinc/nginx-unprivileged
    tag: 1.27-alpine
    pullPolicy: IfNotPresent
  # Numeric UID of the image's non-root user.
  runAsUser: 101
  username: spoke-metrics
  # Where spokes reach the proxy: a NodePort on the hub node.
  nodePort: 30909
  # The hub Prometheus service; its name follows the kube-prometheus-stack
  # release name, so check it against `kubectl -n monitoring get svc`.
  upstream: http://hub-kube-prometheus-stack-prometheus.monitoring.svc:9090
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 200m, memory: 64Mi }

# Alerts on the pod and node metrics the spokes' agents send to the hub (see
# metricsIngest). Series from a spoke carry a `cluster` label; the hub's own
# do not, which is how these rules leave the hub's pods out.
spokeMetrics:
  crashLoopFor: 5m
  notReadyFor: 15m
  nodeNotReadyFor: 5m
  # A spoke whose agent stops sending leaves nothing to alert on, so absence
  # is itself an alert. It must outlast Prometheus's 5m staleness window.
  missingFor: 10m

# Reachability probes of each spoke's API server, from the hub: is it up, how
# fast does it answer, and when does its certificate expire. A blackbox
# exporter does the probing; one Probe per fleet cluster feeds Prometheus.
# The probe sends no credentials, so a 401 or 403 still counts as reachable.
spokeProbes:
  enabled: true
  image:
    repository: prom/blackbox-exporter
    tag: v0.25.0
    pullPolicy: IfNotPresent
  # Numeric UID of the exporter image's `nobody` user.
  runAsUser: 65534
  path: /livez
  interval: 30s
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 100m, memory: 64Mi }
  # Alert thresholds.
  unreachableFor: 2m
  slowSeconds: 1
  slowFor: 10m
  certWarnDays: 14
  certWarnFor: 1h
  certCriticalDays: 3
  certCriticalFor: 10m
  missingFor: 5m

# PrometheusRule on the vmset_* metrics. Needs kube-state-metrics custom
# resource state (infrastructure chart) to produce them. Firing alerts go to
# Alertmanager and on to the alert-router (see alertRouter below).
vmSetAlerts:
  enabled: true
  pendingFor: 10m
  unschedulableFor: 2m
  notReportingFor: 10m
  podsNotRunningFor: 10m
  # Restarts are a running total, so alert on how many happen within the window.
  podRestartWindow: 15m
  podRestartThreshold: 3

bindingController:
  replicas: 1
  metricsPort: 8080
  image:
    repository: sojoner/binding-controller
    tag: dev
    pullPolicy: Always
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }
  dex:
    enabled: true
    clientID: us-spoke-controller
    secretName: binding-controller-dex
    secretKey: client-secret
    pluginImage:
      repository: sojoner/dex-auth-plugin
      tag: dev
      pullPolicy: Always
  spokeTokens:
    - serviceAccountToken:
        path: us-token
        audience: homelab:us-spoke
        expirationSeconds: 3600
    - serviceAccountToken:
        path: eu-token
        audience: homelab:eu-spoke
        expirationSeconds: 3600
