# Hub Services — controllers that depend on infrastructure (Dex, cert-manager)
# Release name: hub-services (or whatever you choose)

dex:
  # Dex issuer URL — must match the Dex deployment in the infrastructure chart
  issuer: "https://bm4080.taildf7067.ts.net/dex"

# Spoke clusters registered on the hub. Each needs a <name>-kubeconfig Secret
# (server + CA) and a projected <name>-token in the controllers that engage it
# (see spokeTokens). Labels let a controller engage only the clusters it serves.
fleet:
  # apiURL is the address the hub reaches the spoke API at; it defaults to
  # https://<name>-control-plane:6443, the kind address the controllers use.
  # Spoke API probes (spokeProbes below) check it.
  clusters:
    - name: us
      displayName: "US Cluster"
    - name: eu
      displayName: "EU Cluster"
      labels:
        platform.example.com/offers-vms: "true"

# VmSet service (VM tiers). Tier names become the allowed `size` values.
vmSet:
  tiers:
    S: { cpu: 1, memory: 1Gi }
    M: { cpu: 2, memory: 2Gi }
  defaultSize: S
  maxReplicas: 3
  image: quay.io/kubevirt/cirros-container-disk-demo:v1.9.1
  guestUser: cirros
  # Printed to the VM's serial console once cloud-init has run; used by tests.
  cloudInitMarker: platform-cloudinit-ok
  # Restricts sshPublicKey to key types/characters that cannot break out of the
  # single-quoted shell line in the generated user-data.
  sshPublicKeyPattern: "^(ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp256) [A-Za-z0-9+/=]+( [A-Za-z0-9@._-]+)?$"

# Places VmSet requests on VM-capable spokes as KubeVirt VMs.
vmBindingController:
  enabled: true
  replicas: 1
  image:
    repository: sojoner/vm-binding-controller
    tag: dev
    pullPolicy: Always
  # Numeric UID of the distroless `nonroot` user; kubelet cannot verify the name.
  runAsUser: 65532
  # Only ClusterProfiles carrying these labels are engaged (see fleet.clusters).
  clusterSelector: "platform.example.com/offers-vms=true"
  runStrategy: Always
  requeueInterval: 30s
  pollInterval: 10s
  defaultNamespace: default
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }
  # One projected token per VM-capable spoke; path must be <clusterName>-token.
  spokeTokens:
    - serviceAccountToken:
        path: eu-token
        audience: homelab:eu-spoke
        expirationSeconds: 3600

# HTTP API in front of VmSet. Callers send their own bearer token, which is
# forwarded to the hub API server, so RBAC on vmsets stays the only access
# control. Off by default until the image is built.
vmSetGateway:
  enabled: false
  replicas: 2
  image:
    repository: sojoner/vmset-gateway
    tag: dev
    pullPolicy: Always
  # Numeric UID of the distroless `nonroot` user.
  runAsUser: 65532
  # Plural resource name Kro generated for VmSet; confirm with
  # `kubectl api-resources | grep platform.example.com`.
  resource: vmsets
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

# Webhook receiver for Alertmanager. On by default because Alertmanager (see
# the infrastructure chart) always sends to it; the image must be built and
# pushed first (`make build-alert-router-image push-alert-router`).
alertRouter:
  enabled: true
  image:
    repository: sojoner/alert-router
    tag: dev
    pullPolicy: Always
  # Numeric UID of the distroless `nonroot` user.
  runAsUser: 65532
  # An unchanged firing alert is not forwarded again within this interval.
  # Resolutions always pass, and an alert that fires again after resolving
  # notifies again.
  dedupeInterval: 10m
  sinkTimeout: 5s
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 100m, memory: 64Mi }

# Telemetry store for the Coroot agents' data (metrics, traces, logs, profiles):
# receives it from the spokes, keeps it in ClickHouse, serves it per project.
# Off by default. One project per fleet cluster; the chart generates an ingest
# key (agents) and a read key (query API) for each into Secret
# telemetry-ingest-keys (`<cluster>.ingest`, `<cluster>.read`). The image must be
# built and pushed first (`make build-telemetry-ingest-image push-telemetry-ingest`).
# Plain HTTP, like the metrics ingest: keep it on the lab's private network.
telemetryIngest:
  enabled: false
  namespace: monitoring
  image:
    repository: us-central1-docker.pkg.dev/fleetapi-513707/k8-pods-images/telemetry-ingest
    tag: dev
    pullPolicy: Always
  # Numeric UID of the distroless `nonroot` user.
  runAsUser: 65532
  retention:
    metrics: 336h
    traces: 168h
    logs: 168h
    profiles: 168h
  # Let the UI's ClickHouse page show the whole platform's table sizes and the server's disks. Off: a project sees only its own rows and size.
  exposeClusterInfo: false
  # Open incidents without anyone looking at a page. Every `interval`, each project's inbound request metrics are judged against an
  # availability and a latency objective, and an incident is opened (once) for an application that burns its error budget `burn` times
  # faster than allowed over both a 5-minute and a 1-hour window. The incident page's own detector is the same algorithm. It only ever OPENS
  # incidents: resolving them is up to whoever is on call. One replica only (the service already is); see docs/platform-mvp/20-telemetry-ingest.md.
  detection:
    enabled: false
    interval: 1m
    lookback: 3h # at least 1h05m
    maxAge: 30m # trouble that ended longer ago than this when first seen is history, not opened
    availability: 0.999 # share of requests that should not fail
    latency: 0.999 # share of requests that should be faster than latencySeconds
    latencySeconds: 0.5
    burn: 14.4 # 14.4 = a 30-day budget gone in two days
    # Also open an incident for an application that has stopped sending data: one set to run N and with fewer ready, or one that is ready and was
    # sending and no longer is. NOT one scaled to zero, a cron job, or one that never sent. Needs the cluster collector (the spoke chart's
    # clusterCollector): without its inventory "stopped sending" cannot be told from "scaled down", and nothing is opened.
    silence:
      after: 5m # silent this long before it is opened (0 = off, else at least 1m)
      exclude: '^(kube-|gke-|gmp-|gatekeeper|config-management|istio-system$|asm-|anthos|cert-manager$|ingress-nginx$|linkerd|calico|tigera|cilium|flux-system$|argocd$|olm$)' # namespaces left out; "" = none
    # Also open an incident for an application that others cannot connect to: a database that has stopped accepting connections, or was scaled to zero
    # while something still calls it, shows in no request metric (it is not an HTTP service, and the application in front may answer with a redirect).
    # The callers' failed connects show it: it opens when `share` of the connection attempts into an application fail, and at least `minFailed` of
    # them, in five minutes, for two minutes. A dependency scaled down on purpose fails its callers' connections the same: the incident says what the
    # cluster collector reports (set to run no replicas, or not ready), so it can be closed as meant. Needs the node-agent; the cluster collector only
    # adds that note. Off by default, and nothing is passed to the service while it is off, so an image without it still starts.
    # Also open an INFORMATION incident for a container that uses far less than it was given (memory, CPU, or a volume), with a limit to try and
    # how it was worked out. How low, over how many days and judged by which percentile of use is a RULE: see `rules` below, and the Rules API
    # (changeable without a deploy). The peak of each step is read, never the average, and a container that has not been watched for most of the
    # window is not judged; storage is off until a rule switches it on. It reads days of metrics, so it looks only every `every`. Off by default, and
    # nothing is passed to the service while it is off, so an image without it still starts.
    rightsizing:
      enabled: false
      every: 1h # at least 10m
      exclude: '^(kube-|gke-|gmp-|gatekeeper|config-management|istio-system$|asm-|anthos|cert-manager$|ingress-nginx$|linkerd|calico|tigera|cilium|flux-system$|argocd$|olm$)' # namespaces left out; "" = none
    dependencies:
      enabled: false
      share: 0.2 # the share of connection attempts into it that fail (0 to 1)
      minFailed: 5 # failed connections in five minutes before the share means anything
      exclude: '^(kube-|gke-|gmp-|gatekeeper|config-management|istio-system$|asm-|anthos|cert-manager$|ingress-nginx$|linkerd|calico|tigera|cilium|flux-system$|argocd$|olm$)' # namespaces left out; "" = none
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 500m, memory: 512Mi }
  # "Analyse with Claude" on an incident: a button on the incident page (it takes a manage key, typed per click) sends the incident's title, severity,
  # summary and WHERE its evidence is to the Anthropic API, and keeps the resolution steps that come back as a comment by "claude". What is sent: nothing
  # from logs or traces, no search text, address, note, person or project name; the prompt is analysis.Prompt in the service. The key is yours, in a
  # Secret you make; each call costs what the model costs, and one incident is analysed at most every two minutes.
  #   kubectl -n monitoring create secret generic anthropic-api-key --from-literal=apiKey=<key>
  # Nothing is passed to the service while this is off, so an image without it still starts.
  # Tell people when the detector opens an incident: it is posted to Alertmanager once, when it opens (see `alertmanager` below for one that sends to
  # Slack). Only warning and critical by default, so the information-only incidents (over-provisioned containers) are never a message. `alertmanagerUrl`
  # defaults to the chart's own Alertmanager when that is on, and is required otherwise. `uiUrl` makes each message link to the incident's page in the
  # UI, and is left out when empty. Nothing is passed to the service while this is off, so an image without it still starts.
  notify:
    enabled: false
    alertmanagerUrl: ""
    minSeverity: warning # critical, warning or info
    uiUrl: ""
  # The infrastructure cost report (the UI's Costs page): what the nodes cost, what the money is for (used, requested and not used, requested by nobody) and where it is
  # wasted. It is a FEATURE, off by default: while it is off the hub answers 404 for the report and the UI shows no Costs page. Nodes are priced from `prices` (your
  # own price per hour by instance type, which wins) and, for Azure and when `azurePrices` is on, from Azure's public price list, which the hub then needs to reach
  # (prices.azure.com, HTTPS). These are LIST prices: reservations and discounts make the real ones lower, so set `prices` to what you pay. Cloud nodes do not say
  # whether they are spot, so every node is priced as on-demand; give a spot node's type a `spotHourly` and set its lifecycle if you know. What pods REQUEST comes
  # from the cluster collector: without it the page shows usage and idle only. `vcpuGbRatio` is how many GiB of memory cost as much as one core (7.5 is about what
  # the clouds charge) and splits a node's price between its CPU and its memory. Nothing is passed to the service while this is off.
  costs:
    enabled: false
    azurePrices: true
    vcpuGbRatio: 7.5
    prices: {} # for example { Standard_D4s_v6: { hourly: 0.25, spotHourly: 0.07 } }
  # The settings a rule has until a project saves its own (GET/PUT /api/v1/projects/<project>/rules): only what differs from the built-in defaults, which are
  # memory and CPU on at 50% over 7 days judged by the 95th percentile of use, and storage off. For example
  #   defaults: { rightsize.memory: { percent: 40 }, rightsize.storage: { enabled: true } }
  # The Rules API is always there (it only reads and saves settings); the right-sizing detector, which uses them, is `detection.rightsizing`.
  rules:
    defaults: {}
  analysis:
    enabled: false
    model: claude-opus-5-5
    existingSecret: anthropic-api-key
    secretKey: apiKey
  # How the spokes' agents reach the service (it always has the in-cluster name
  # telemetry-ingest.<namespace>.svc). ClusterIP: this cluster only. NodePort:
  # the kind lab, where spokes use http://hub-control-plane:<nodePort> over the
  # Docker network (30080, 30317 and 30909 are taken by Coroot and the metrics
  # ingest). LoadBalancer: a cloud; use the provider's annotation for an
  # internal one, for example on GKE
  #   networking.gke.io/load-balancer-type: "Internal"
  # and add networking.gke.io/internal-load-balancer-allow-global-access: "true"
  # if the spoke is in another region. Plain HTTP and one port for both ingest and
  # the query API: keep it private and restrict who can reach it.
  service:
    type: ClusterIP
    nodePort: 30081
    grpcNodePort: 30318
    annotations: {}
    loadBalancerSourceRanges: []
  # A ServiceMonitor for the service's /metrics. It needs the Prometheus Operator
  # CRDs (the kind lab has them); set false on a cluster without them, such as a
  # plain GKE cluster, or the apply fails on that one object.
  serviceMonitor:
    enabled: true
  # A single replica; the tables are not replicated.
  clickhouse:
    image:
      repository: clickhouse/clickhouse-server
      tag: "24.8"
      pullPolicy: IfNotPresent
    storage: 5Gi
    resources:
      requests: { cpu: 100m, memory: 512Mi }
      limits: { cpu: "1", memory: 2Gi }
    # Tiered storage: recent data stays on the volume above, older data moves to a Google Cloud Storage bucket and is still queried
    # through the same tables. Only the four big tables (metrics, traces, logs, profile samples) move. The bucket is reached through
    # its S3-compatible API with an HMAC key, which you create and put in a Secret yourself:
    #   gsutil hmac create <service-account>
    #   kubectl -n monitoring create secret generic telemetry-gcs \
    #     --from-literal=accessKeyId=<access id> --from-literal=secretAccessKey=<secret>
    # The service account needs roles/storage.objectAdmin on the bucket. Data moves a whole part at a time, when the part's newest
    # row is older than coldAfter, so expect up to about a day more than that. coldAfter must be shorter than every retention above;
    # the service refuses to start otherwise. Switching this off later does not bring moved data back; it stays in the bucket.
    coldStorage:
      enabled: true
      bucket: "fleetapi-telemetry-cold"
      path: telemetry
      endpoint: https://storage.googleapis.com
      existingSecret: "telemetry-gcs"
      coldAfter: 48h
      # Local cache of bucket reads, in bytes, kept on the volume above.
      cacheBytes: 1073741824

# The telemetry UI (platform-mvp/telemetry-ui): a static app plus a proxy of the
# read API, in nginx. Build and push the image first
# (`make build-telemetry-ui-image push-telemetry-ui`). It holds no key: the user
# enters a project and its read key in the page. Reach it with
#   kubectl -n monitoring port-forward svc/telemetry-ui 8081:80
# or set service.type for a private address, as for telemetryIngest.service.
# Plain HTTP; the read key crosses it, so keep it private or put TLS in front.
telemetryUi:
  enabled: true
  namespace: monitoring
  replicas: 1
  image:
    repository: us-central1-docker.pkg.dev/fleetapi-513707/k8-pods-images/telemetry-ui
    tag: dev
    pullPolicy: Always
  # Numeric UID of the nginx-unprivileged image's user.
  runAsUser: 101
  # Where /api is proxied (scheme and host, no path). Empty: the telemetry-ingest Service.
  apiUpstream: ""
  # Where the alerts path goes. Empty: the telemetry-alerts Service.
  alertsUpstream: ""
  # The Costs page: false (the default) leaves it out of the menu and the routes. The hub has its own switch, telemetryIngest.costs.enabled.
  costs:
    enabled: false
  service:
    type: ClusterIP
    nodePort: 30082
    annotations: {}
    loadBalancerSourceRanges: []
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 200m, memory: 64Mi }

# The alert service (platform-mvp/telemetry-ui, Dockerfile.alerts): checks every project for services that are not serving, with
# nobody looking, and serves the result to the UI at /api/v1/projects/<project>/alerts (same read keys). It reads the project
# list and read keys from the telemetry-ingest-keys Secret, so it must run in the same namespace as telemetryIngest. Build and push
# the image first (`make build-telemetry-alerts-image push-telemetry-alerts`). Optional: tell an Alertmanager as well.
telemetryAlerts:
  enabled: false
  namespace: monitoring
  image:
    repository: sojoner/telemetry-alerts
    tag: dev
    pullPolicy: Always
  # Numeric UID of the node image's non-root user.
  runAsUser: 1000
  # Empty: the telemetry-ingest Service.
  readApi: ""
  intervalSeconds: 60
  # Where to post firing alerts, for example http://hub-kube-prometheus-stack-alertmanager.monitoring.svc:9093 (check the name
  # with `kubectl -n monitoring get svc`). Empty: not posted; the UI and /metrics still have them.
  alertmanagerUrl: ""
  # Thresholds that differ from the defaults, for example {errorShare: 10, baselineSeconds: 7200}. See alerts/rules.js.
  thresholds: {}
  # Alert state is kept in a file so a restart does not forget what is firing. An emptyDir survives a container restart but not
  # a new pod; a volume survives both.
  persistence:
    enabled: false
    size: 100Mi
    storageClassName: ""
  # A ServiceMonitor for /metrics. Needs the Prometheus Operator CRDs; leave off on a cluster without them.
  serviceMonitor:
    enabled: false
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { cpu: 300m, memory: 192Mi }

# An Alertmanager that tells people: it takes the alerts the alert service (telemetryAlerts) sends it, and the incidents the hub's detector opens
# (telemetryIngest.notify), and posts them to Slack. It is a plain single pod with nothing to install first (no operator, no CRDs): the config is
# rendered here, and the Slack incoming-webhook URL, which is a secret, is read from a Secret you make:
#   kubectl -n monitoring create secret generic alertmanager-slack --from-literal=webhook=https://hooks.slack.com/services/...
# Alerts that are still firing are grouped and repeated every `repeatInterval`; an incident is told ONCE, when it opens (nothing here resolves it, so no
# "resolved" follows it). Silences and the log of what was sent live in the pod's memory-backed volume: they are lost when the pod is replaced.
# When this is on and telemetryAlerts.alertmanagerUrl is empty, the alert service sends to it.
alertmanager:
  enabled: false
  namespace: monitoring
  image:
    repository: quay.io/prometheus/alertmanager
    tag: v0.27.0
    pullPolicy: IfNotPresent
  # Numeric UID of the image's non-root user (nobody).
  runAsUser: 65534
  slack:
    existingSecret: alertmanager-slack
    secretKey: webhook
    # Only for a webhook that lets the message pick its channel (a legacy one); an app's incoming webhook ignores it.
    channel: ""
    # Say when an alert that was firing has stopped (alerts from the alert service only; an incident is never "resolved" here).
    sendResolved: true
  route:
    groupBy: [alertname, project]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }

# Receives the spokes' pod metrics. Each spoke runs a Prometheus agent that
# remote-writes here; this proxy is the only way in, so the hub Prometheus is
# never exposed. Basic auth with a generated credential (kept on upgrades);
# copy it to each spoke with `make spoke-metrics-credentials`.
# Traffic is plain HTTP, which is only acceptable on the lab's private Docker
# network: terminate TLS in front of it anywhere else.
metricsIngest:
  enabled: true
  image:
    repository: nginxinc/nginx-unprivileged
    tag: 1.27-alpine
    pullPolicy: IfNotPresent
  # Numeric UID of the image's non-root user.
  runAsUser: 101
  username: spoke-metrics
  # Where spokes reach the proxy: a NodePort on the hub node.
  nodePort: 30909
  # The hub Prometheus service; its name follows the kube-prometheus-stack
  # release name, so check it against `kubectl -n monitoring get svc`.
  upstream: http://hub-kube-prometheus-stack-prometheus.monitoring.svc:9090
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 200m, memory: 64Mi }

# Alerts on the pod and node metrics the spokes' agents send to the hub (see
# metricsIngest). Series from a spoke carry a `cluster` label; the hub's own
# do not, which is how these rules leave the hub's pods out.
spokeMetrics:
  crashLoopFor: 5m
  notReadyFor: 15m
  nodeNotReadyFor: 5m
  # A spoke whose agent stops sending leaves nothing to alert on, so absence
  # is itself an alert. It must outlast Prometheus's 5m staleness window.
  missingFor: 10m

# Reachability probes of each spoke's API server, from the hub: is it up, how
# fast does it answer, and when does its certificate expire. A blackbox
# exporter does the probing; one Probe per fleet cluster feeds Prometheus.
# The probe sends no credentials, so a 401 or 403 still counts as reachable.
spokeProbes:
  enabled: true
  image:
    repository: prom/blackbox-exporter
    tag: v0.25.0
    pullPolicy: IfNotPresent
  # Numeric UID of the exporter image's `nobody` user.
  runAsUser: 65534
  path: /livez
  interval: 30s
  resources:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 100m, memory: 64Mi }
  # Alert thresholds.
  unreachableFor: 2m
  slowSeconds: 1
  slowFor: 10m
  certWarnDays: 14
  certWarnFor: 1h
  certCriticalDays: 3
  certCriticalFor: 10m
  missingFor: 5m

# PrometheusRule on the vmset_* metrics. Needs kube-state-metrics custom
# resource state (infrastructure chart) to produce them. Firing alerts go to
# Alertmanager and on to the alert-router (see alertRouter below).
vmSetAlerts:
  enabled: true
  pendingFor: 10m
  unschedulableFor: 2m
  notReportingFor: 10m
  podsNotRunningFor: 10m
  # Restarts are a running total, so alert on how many happen within the window.
  podRestartWindow: 15m
  podRestartThreshold: 3

bindingController:
  replicas: 1
  metricsPort: 8080
  image:
    repository: sojoner/binding-controller
    tag: dev
    pullPolicy: Always
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { cpu: 200m, memory: 128Mi }
  dex:
    enabled: true
    clientID: us-spoke-controller
    secretName: binding-controller-dex
    secretKey: client-secret
    pluginImage:
      repository: sojoner/dex-auth-plugin
      tag: dev
      pullPolicy: Always
  spokeTokens:
    - serviceAccountToken:
        path: us-token
        audience: homelab:us-spoke
        expirationSeconds: 3600
    - serviceAccountToken:
        path: eu-token
        audience: homelab:eu-spoke
        expirationSeconds: 3600
