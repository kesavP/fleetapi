{{- if .Values.telemetryAlerts.enabled }}
{{- $a := .Values.telemetryAlerts }}
{{- $ns := $a.namespace }}
{{- if ne $ns .Values.telemetryIngest.namespace }}
{{- fail (printf "telemetryAlerts.namespace %q must equal telemetryIngest.namespace %q: it mounts that namespace's telemetry-ingest-keys Secret" $ns .Values.telemetryIngest.namespace) }}
{{- end }}
{{- if and $a.persistence.enabled (not $a.persistence.size) }}
{{- fail "telemetryAlerts.persistence.size is required when persistence is enabled" }}
{{- end }}
# Checks every project for services that are not serving and serves the alerts to the UI. See docs/platform-mvp/21-telemetry-ui.md.
#
# It reads each project's READ key from the telemetry-ingest-keys Secret (only projects.json is mounted) and uses it to read the
# telemetry API like any client, so it can see what a read key can see and nothing more. The alerts are served back to a caller
# that presents one of the project's read keys.
apiVersion: v1
kind: Service
metadata:
  name: telemetry-alerts
  namespace: {{ $ns }}
  labels:
    app: telemetry-alerts
spec:
  type: ClusterIP
  selector:
    app: telemetry-alerts
  ports:
    - name: http
      port: 80
      targetPort: http
---
{{- if $a.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: telemetry-alerts-state
  namespace: {{ $ns }}
  labels:
    app: telemetry-alerts
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with $a.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $a.persistence.size }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-alerts
  namespace: {{ $ns }}
  labels:
    app: telemetry-alerts
spec:
  # One replica: two would each keep their own idea of what is firing and each tell Alertmanager.
  replicas: 1
  {{- if $a.persistence.enabled }}
  # A ReadWriteOnce volume cannot be mounted by the old and the new pod at once.
  strategy:
    type: Recreate
  {{- end }}
  selector:
    matchLabels:
      app: telemetry-alerts
  template:
    metadata:
      labels:
        app: telemetry-alerts
    spec:
      automountServiceAccountToken: false
      securityContext:
        # Makes the state volume writable by the image's user.
        fsGroup: {{ $a.runAsUser }}
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: projects
          secret:
            secretName: telemetry-ingest-keys
            items:
              - key: projects.json
                path: projects.json
        - name: state
          {{- if $a.persistence.enabled }}
          persistentVolumeClaim:
            claimName: telemetry-alerts-state
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir: {}
      containers:
        - name: telemetry-alerts
          image: "{{ $a.image.repository }}:{{ $a.image.tag }}"
          imagePullPolicy: {{ $a.image.pullPolicy }}
          env:
            - name: PORT
              value: "8081"
            - name: READ_API
              value: {{ default (printf "http://telemetry-ingest.%s.svc.cluster.local" $.Values.telemetryIngest.namespace) $a.readApi | quote }}
            - name: PROJECTS_FILE
              value: /etc/telemetry/projects/projects.json
            - name: STATE_FILE
              value: /var/lib/telemetry-alerts/state.json
            - name: INTERVAL_SECONDS
              value: {{ $a.intervalSeconds | quote }}
            {{- with $a.alertmanagerUrl }}
            - name: ALERTMANAGER_URL
              value: {{ . | quote }}
            {{- end }}
            {{- if $a.thresholds }}
            - name: RULES_JSON
              value: {{ $a.thresholds | toJson | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8081
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: {{ $a.runAsUser }}
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: projects
              mountPath: /etc/telemetry/projects
              readOnly: true
            - name: state
              mountPath: /var/lib/telemetry-alerts
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml $a.resources | nindent 12 }}
{{- if $a.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: telemetry-alerts
  namespace: {{ $ns }}
  labels:
    app: telemetry-alerts
spec:
  selector:
    matchLabels:
      app: telemetry-alerts
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
{{- end }}
{{- end }}
