{{- if .Values.metricsIngest.enabled }}
# Authenticating front door for remote write. The hub Prometheus accepts
# remote write (infrastructure chart, enableRemoteWriteReceiver) but has no
# authentication of its own, so spokes reach it only through this proxy, which
# passes nothing but an authenticated POST to /api/v1/write.
#
# The credential is generated on first install and kept on upgrades: `lookup`
# finds the existing Secret, so the password does not change (and the spokes do
# not lose access) each time the chart is rendered. Under `helm template` there
# is no cluster to look up, so a throwaway value is rendered.
{{- $existing := lookup "v1" "Secret" "monitoring" "metrics-ingest-auth" }}
{{- $password := randAlphaNum 40 }}
apiVersion: v1
kind: Secret
metadata:
  name: metrics-ingest-auth
  namespace: monitoring
type: Opaque
data:
  {{- if and $existing $existing.data }}
  username: {{ index $existing.data "username" }}
  password: {{ index $existing.data "password" }}
  htpasswd: {{ index $existing.data "htpasswd" }}
  {{- else }}
  username: {{ .Values.metricsIngest.username | b64enc }}
  password: {{ $password | b64enc }}
  htpasswd: {{ htpasswd .Values.metricsIngest.username $password | b64enc }}
  {{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: metrics-ingest
  namespace: monitoring
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    error_log /dev/stderr warn;
    events { worker_connections 256; }
    http {
      client_body_temp_path /tmp/client_temp;
      proxy_temp_path /tmp/proxy_temp;
      fastcgi_temp_path /tmp/fastcgi_temp;
      uwsgi_temp_path /tmp/uwsgi_temp;
      scgi_temp_path /tmp/scgi_temp;
      # The default log format carries no Authorization header.
      access_log /dev/stdout;
      server {
        listen 8080;
        location = /healthz { access_log off; return 200 "ok\n"; }
        location = /api/v1/write {
          limit_except POST { deny all; }
          auth_basic "metrics ingest";
          auth_basic_user_file /etc/ingest/htpasswd;
          client_max_body_size 16m;
          proxy_pass {{ .Values.metricsIngest.upstream }}/api/v1/write;
          proxy_http_version 1.1;
        }
        location / { return 404; }
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-ingest
  namespace: monitoring
  labels:
    app: metrics-ingest
spec:
  type: NodePort
  selector:
    app: metrics-ingest
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: {{ .Values.metricsIngest.nodePort }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-ingest
  namespace: monitoring
  labels:
    app: metrics-ingest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: metrics-ingest
  template:
    metadata:
      labels:
        app: metrics-ingest
      annotations:
        # Roll the pod when the proxy config changes.
        checksum/config: {{ .Values.metricsIngest | toJson | sha256sum }}
    spec:
      automountServiceAccountToken: false
      volumes:
        - name: config
          configMap:
            name: metrics-ingest
        - name: auth
          secret:
            secretName: metrics-ingest-auth
            items:
              - key: htpasswd
                path: htpasswd
        - name: tmp
          emptyDir: {}
      containers:
        - name: nginx
          image: "{{ .Values.metricsIngest.image.repository }}:{{ .Values.metricsIngest.image.tag }}"
          imagePullPolicy: {{ .Values.metricsIngest.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: {{ .Values.metricsIngest.runAsUser }}
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: auth
              mountPath: /etc/ingest
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.metricsIngest.resources | nindent 12 }}
{{- end }}
