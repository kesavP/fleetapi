  enabled: false
  host: bm4080.taildf7067.ts.net

cert-manager:
  enabled: true
  installCRDs: true

dex:
  enabled: true
  namespace: monitoring
  issuer: "https://bm4080.taildf7067.ts.net/dex"
  image:
    repository: ghcr.io/dexidp/dex
    tag: v2.42.0
    pullPolicy: IfNotPresent
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { cpu: 100m, memory: 128Mi }
  # infrastructureClients: Dex clients for service identities. Still used by
  # bindingController's dex-auth-plugin sidecar (chart/hub-services) — do not
  # remove even though token-rotator (the original consumer) is gone.
  infrastructureClients:
    - id: us-spoke-controller
      name: US Spoke Controller (Infrastructure)
      secret: us-spoke-controller-secret-demo
    - id: eu-spoke-controller
      name: EU Spoke Controller (Infrastructure)
      secret: eu-spoke-controller-secret-demo
    - id: asia-spoke-controller
      name: Asia Spoke Controller (Infrastructure)
      secret: asia-spoke-controller-secret-demo
  tenantClients:
    - id: acme-corp-us-controller
      name: ACME Corp US Controller
      secret: acme-corp-us-secret-demo
    - id: globex-inc-us-controller
      name: Globex Inc US Controller
      secret: globex-inc-us-secret-demo
  connectors: []
