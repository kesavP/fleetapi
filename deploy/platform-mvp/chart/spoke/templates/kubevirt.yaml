{{- if .Values.kubevirt.enabled }}
# The KubeVirt operator (CRDs, namespace, virt-operator) is applied from the
# cached upstream manifest by `make deploy-wave4` before this chart installs,
# so the KubeVirt kind is already served here.
apiVersion: kubevirt.io/v1
kind: KubeVirt
metadata:
  name: kubevirt
  namespace: kubevirt
spec:
  certificateRotateStrategy: {}
  configuration:
    developerConfiguration:
      # false = hardware virtualization via /dev/kvm; true only for hosts without KVM.
      useEmulation: {{ .Values.kubevirt.useEmulation }}
  imagePullPolicy: {{ .Values.kubevirt.imagePullPolicy }}
  workloadUpdateStrategy: {}
{{- end }}
