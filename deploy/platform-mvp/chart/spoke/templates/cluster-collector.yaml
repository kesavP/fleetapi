{{- if .Values.clusterCollector.enabled }}
{{- $cc := .Values.clusterCollector }}
{{- $na := .Values.nodeAgent }}
{{- $url := default $na.collectorURL $cc.collectorURL }}
{{- $url = required "clusterCollector.collectorURL (or nodeAgent.collectorURL) must be set to the hub telemetry-ingest URL" $url }}
{{- if not (regexMatch "^https?://[^/?#]+(/[^?#]*)?$" $url) }}
{{- fail (printf "the collector URL %q must be an http(s) URL without a query string" $url) }}
{{- end }}
{{- $cluster := required "clusterCollector.clusterName must be set to this cluster's name (lower-case letters, digits and . _ -)" $cc.clusterName }}
{{- if not (regexMatch "^[a-z0-9]([a-z0-9._-]{0,62}[a-z0-9])?$" $cluster) }}
{{- fail (printf "clusterCollector.clusterName %q must be lower-case letters, digits and . _ -, starting and ending with a letter or digit" $cluster) }}
{{- end }}
{{- $repo := required "clusterCollector.image.repository must be set (build it with `make build-cluster-collector-image`)" $cc.image.repository }}
{{- $tag := required "clusterCollector.image.tag must be set to a pinned version, not latest" $cc.image.tag }}
{{- if eq $tag "latest" }}
{{- fail "clusterCollector.image.tag must be a pinned version, not latest" }}
{{- end }}
{{- if not (has $cc.events (list "warning" "all" "none")) }}
{{- fail (printf "clusterCollector.events %q must be warning, all or none" $cc.events) }}
{{- end }}
# The cluster collector: one read-only Deployment that reports what is IN this cluster (nodes, namespaces, workloads, pods, volume claims,
# autoscalers, events) to the hub's telemetry-ingest, beside the node-agent that reports what is HAPPENING on each node. It only pushes: the hub
# never reaches into the cluster. It authenticates with this cluster's ingest key, in a Secret in this namespace (the node-agent's by default).
#
# Its service account may get and list the kinds below and nothing else: NOT Secrets or ConfigMaps (it has no use for them, and what it
# reports is picked field by field in the collector, never copied), and nothing may be written.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cluster-collector
  namespace: {{ $cc.namespace }}
  labels:
    app: cluster-collector
    app.kubernetes.io/part-of: platform-mvp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: platform-cluster-collector
  labels:
    app: cluster-collector
    app.kubernetes.io/part-of: platform-mvp
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, pods, persistentvolumeclaims, events]
    verbs: [get, list]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets, daemonsets]
    verbs: [get, list]
  - apiGroups: [batch]
    resources: [cronjobs, jobs]
    verbs: [get, list]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list]
  # KEDA is optional: where it is not installed this rule matches nothing.
  - apiGroups: [keda.sh]
    resources: [scaledobjects]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: platform-cluster-collector
  labels:
    app: cluster-collector
    app.kubernetes.io/part-of: platform-mvp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: platform-cluster-collector
subjects:
  - kind: ServiceAccount
    name: cluster-collector
    namespace: {{ $cc.namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cluster-collector
  namespace: {{ $cc.namespace }}
  labels:
    app: cluster-collector
    app.kubernetes.io/part-of: platform-mvp
spec:
  # One: two would report the same cluster twice. Recreate, so a rollout never has two for a moment.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: cluster-collector
  template:
    metadata:
      labels:
        app: cluster-collector
    spec:
      serviceAccountName: cluster-collector
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cluster-collector
          image: "{{ $repo }}:{{ $tag }}"
          imagePullPolicy: {{ $cc.image.pullPolicy }}
          args:
            - --endpoint={{ $url }}
            - --cluster={{ $cluster }}
            # the key is read from a mounted file, so it is in neither the pod's spec nor its environment
            - --api-key-file=/etc/cluster-collector/key/{{ $cc.apiKeySecret.key }}
            - --interval={{ $cc.interval }}
            - --resync={{ $cc.resync }}
            - --events={{ $cc.events }}
            {{- if $cc.excludeNamespaces }}
            - --exclude-namespaces={{ join "," $cc.excludeNamespaces }}
            {{- end }}
            {{- if $cc.tlsSkipVerify }}
            - --tls-skip-verify
            {{- end }}
            {{- if $cc.caSecret.name }}
            - --ca-file=/etc/cluster-collector/ca/{{ $cc.caSecret.key }}
            {{- end }}
            {{- range $cc.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            - name: probes
              containerPort: 8082
          livenessProbe:
            httpGet: {path: /healthz, port: probes}
            periodSeconds: 30
          # Ready once a look has been reported, and while they keep being. A hub that is down makes it not ready; it does not get it restarted.
          readinessProbe:
            httpGet: {path: /readyz, port: probes}
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            {{- toYaml $cc.resources | nindent 12 }}
          volumeMounts:
            - name: key
              mountPath: /etc/cluster-collector/key
              readOnly: true
            {{- if $cc.caSecret.name }}
            - name: ca
              mountPath: /etc/cluster-collector/ca
              readOnly: true
            {{- end }}
      volumes:
        - name: key
          secret:
            secretName: {{ $cc.apiKeySecret.name }}
            items:
              - key: {{ $cc.apiKeySecret.key }}
                path: {{ $cc.apiKeySecret.key }}
        {{- if $cc.caSecret.name }}
        - name: ca
          secret:
            secretName: {{ $cc.caSecret.name }}
        {{- end }}
{{- end }}
