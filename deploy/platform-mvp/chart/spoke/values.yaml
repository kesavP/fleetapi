# Sends this spoke's pod and node metrics to the hub: kube-state-metrics for
# pod state, the kubelet's cAdvisor endpoint for pod CPU and memory, scraped by
# a Prometheus agent that remote-writes to the hub's metrics-ingest proxy.
# Off by default: it needs clusterName and the credential Secret
# (`make spoke-metrics-credentials`). Set both per spoke in values-<name>.yaml.
metricsAgent:
  enabled: false
  # Must equal the cluster's name in the hub's fleet.clusters: it becomes the
  # `cluster` label on every series, which the hub's alerts and probes also use.
  clusterName: ""
  remoteWriteURL: "http://hub-control-plane:30909/api/v1/write"
  # Must match the hub's metricsIngest.username.
  username: spoke-metrics
  # Secret in this namespace with the key `password`.
  credentialsSecret: hub-metrics-credentials
  scrapeInterval: 30s
  # Numeric UID of the images' `nobody` user.
  runAsUser: 65534
  image:
    repository: prom/prometheus
    tag: v2.53.0
    pullPolicy: IfNotPresent
  kubeStateMetrics:
    image:
      repository: registry.k8s.io/kube-state-metrics/kube-state-metrics
      tag: v2.19.1
      pullPolicy: IfNotPresent
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { cpu: 100m, memory: 128Mi }
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { cpu: 200m, memory: 256Mi }

# Reports what is IN this cluster (nodes, namespaces, workloads, pods, volume claims, HPAs, KEDA ScaledObjects, events) to the hub's
# telemetry-ingest: one read-only Deployment, beside the node-agent (which reports what is happening on each node). Off by default.
# It uses the node-agent's namespace, hub URL and key Secret unless told otherwise, so the namespace and the Secret must exist first (see
# nodeAgent.namespace / createNamespace). It needs an image of its own: `make build-cluster-collector-image push-cluster-collector`.
clusterCollector:
  enabled: false
  namespace: telemetry-agent
  # Empty: nodeAgent.collectorURL.
  collectorURL: ""
  # This cluster's name as the hub lists it (lower-case letters, digits and . _ -).
  clusterName: ""
  # This cluster's ingest key, as for the node-agent. Mounted as a file, never put in values or the environment.
  apiKeySecret:
    name: hub-telemetry-credentials
    key: apiKey
  tlsSkipVerify: false
  caSecret:
    name: ""
    key: ca.crt
  image:
    repository: ""
    # No default: pin a version you have built.
    tag: ""
    pullPolicy: IfNotPresent
  # How often it looks, and how often it sends everything again (which also repairs a report that was lost).
  interval: 30s
  resync: 30m
  # warning (what went wrong), all (scaling, scheduling, pulling too) or none.
  events: warning
  # Namespaces to leave out entirely.
  excludeNamespaces: []
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 256Mi }
  extraArgs: []

admissionPolicies:
  enabled: true
  platformAdminSubjects:
    - kind: Group
      name: dex:platform-admin
  additionalProtectedNamespaces: []

bindingControllerRBAC:
  enabled: true
  hubIdentity: "hub:system:serviceaccount:default:binding-controller"

tenants:
  - id: acme-corp
    dexGroups: ["acme-corp-admin", "acme-corp-developer", "acme-corp-analyst"]
  - id: globex-inc
    dexGroups: ["globex-inc-admin", "globex-inc-developer", "globex-inc-analyst"]

# KubeVirt (VMs as a service). Enabled per spoke in values-<name>.yaml; the
# spoke host needs /dev/kvm unless useEmulation is true.
kubevirt:
  enabled: false
  useEmulation: false
  imagePullPolicy: IfNotPresent

# RBAC for the hub's vm-binding-controller on VM-capable spokes. Namespaces
# beyond the tenants (e.g. the fallback namespace) go in extraNamespaces.
vmBindingControllerRBAC:
  enabled: false
  hubIdentity: "hub:system:serviceaccount:default:vm-binding-controller"
  extraNamespaces: [default]

# Coroot agents (service map, eBPF telemetry) reporting to a Coroot server on
# the hub. The Coroot operator must already be running in `namespace` (the
# Makefile's coroot-operator target installs it); this chart only declares the
# agents-only Coroot resource it acts on. Off by default.
coroot:
  enabled: false
  namespace: coroot
  # Where the agents send telemetry; must be reachable from this spoke's pods.
  corootURL: ""
  tlsSkipVerify: false
  # Secret in `namespace` holding this spoke's API key (one Coroot project per
  # spoke). Copied from the hub by hack/platform-mvp/copy-coroot-credentials.sh.
  apiKeySecret:
    name: hub-coroot-credentials
    key: apiKey
  # Passed through to the operator's nodeAgent.resources.
  nodeAgentResources: {}

# Coroot's node-agent as a plain DaemonSet, pushing eBPF telemetry (metrics,
# traces, logs, profiles) to the hub's telemetry-ingest. Unlike `coroot` above
# it needs no Coroot operator, CRD or Helm chart. Off by default; setting both
# `coroot.enabled` and this is refused. See docs/platform-mvp/20-telemetry-ingest.md.
nodeAgent:
  enabled: false
  # The namespace must exist before the chart is installed, because the key
  # Secret has to be created in it first. If the cluster enforces Pod Security
  # Admission, label it pod-security.kubernetes.io/enforce=privileged (the agent
  # is privileged); createNamespace=true has the chart create it with that label.
  namespace: telemetry-agent
  createNamespace: false
  # The hub telemetry-ingest, as reachable from this spoke's pods, e.g.
  # http://hub-control-plane:30081. The agent appends /v1/metrics and the rest.
  collectorURL: ""
  tlsSkipVerify: false
  # For an https hub with a private CA: a Secret in `namespace` holding the
  # certificate under `key`.
  caSecret:
    name: ""
    key: ca.crt
  # This cluster's ingest key (`<cluster>.ingest` in the hub's Secret
  # telemetry-ingest-keys), in a Secret in `namespace`. Never set in values.
  apiKeySecret:
    name: hub-telemetry-credentials
    key: apiKey
  image:
    repository: ghcr.io/coroot/coroot-node-agent
    # No default: pin a version you have tested, or your own build.
    tag: ""
    pullPolicy: IfNotPresent
  # On-disk buffer for metrics the hub cannot accept; the oldest batch goes
  # first when it is full. The volume limit must be larger.
  spoolSize: 500MB
  spoolVolumeLimit: 1Gi
  # Requests only: the agent's real footprint depends on how busy a node is, so
  # set limits after measuring it on your own nodes.
  resources:
    requests: { cpu: 100m, memory: 128Mi }
  nodeSelector:
    kubernetes.io/os: linux
  # Every node, tainted ones included, as the agent's own manifest does.
  tolerations:
    - operator: Exists
  # Extra agent flags and environment, e.g. --container-denylist.
  extraArgs: []
  extraEnv: []
