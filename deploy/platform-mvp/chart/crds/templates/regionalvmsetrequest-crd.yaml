apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: regionalvmsetrequests.platform.example.com
spec:
  group: platform.example.com
  names:
    kind: RegionalVmSetRequest
    listKind: RegionalVmSetRequestList
    plural: regionalvmsetrequests
    singular: regionalvmsetrequest
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Region
          type: string
          jsonPath: .spec.region
        - name: Replicas
          type: integer
          jsonPath: .spec.replicas
        - name: Phase
          type: string
          jsonPath: .status.regions[0].phase
        - name: Ready
          type: integer
          jsonPath: .status.regions[0].readyReplicas
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [region, replicas, cpu, memory, image, cloudInitSecretName]
              properties:
                region:
                  type: string
                  enum: [us, eu, asia]
                replicas:
                  type: integer
                  minimum: 1
                # The tier is fixed once ordered: cpu/memory/image cannot change.
                cpu:
                  type: integer
                  minimum: 1
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: cpu is immutable
                memory:
                  type: string
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: memory is immutable
                image:
                  type: string
                  x-kubernetes-validations:
                    - rule: self == oldSelf
                      message: image is immutable
                cloudInitSecretName:
                  type: string
            status:
              type: object
              properties:
                regions:
                  type: array
                  items:
                    type: object
                    properties:
                      region:
                        type: string
                      phase:
                        type: string
                        enum: [Pending, Ready, Unschedulable]
                      readyReplicas:
                        type: integer
                      message:
                        type: string
                      podRestarts:
                        type: integer
                      podsNotRunning:
                        type: integer
                      cluster:
                        type: object
                        properties:
                          name:
                            type: string
                          displayName:
                            type: string
                          kubernetesVersion:
                            type: string
                          controlPlaneHealthy:
                            type: string
                      vms:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            phase:
                              type: string
                            node:
                              type: string
                            ip:
                              type: string
                            pod:
                              type: object
                              properties:
                                name:
                                  type: string
                                phase:
                                  type: string
                                podIP:
                                  type: string
                                restarts:
                                  type: integer
