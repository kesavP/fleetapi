# Source: hub-services/templates/telemetry-ingest.yaml
# Hub-side telemetry store for the Coroot agents' data: receives it from the
# spokes, keeps it in ClickHouse and serves it per project (one project per
# fleet cluster). See docs/platform-mvp/20-telemetry-ingest.md.
#
# Keys. Each fleet cluster gets an ingest key (its agents send with it) and a
# read key (the query API). They are generated once and kept on upgrades
# (`lookup` finds the existing Secret); under `helm template` there is no
# cluster, so throwaway values are rendered. projects.json is derived from the
# same keys, so the two can never disagree.
apiVersion: v1
kind: Secret
metadata:
  name: telemetry-ingest-keys
  namespace: monitoring
  labels:
    app: telemetry-ingest
type: Opaque
stringData:
  us.ingest: "83pQ3o0BreGFGzkHozbA2LMLm1LGmcqg"
  us.read: "bP6rjPBYPgws7V1qEJZ4AUPgVLjvvyc4"
  eu.ingest: "hyVGIrUtMy5LZusd0S4dfBvShLwihYF6"
  eu.read: "aoeD1P4Yi9Y4SaZV3q2ATtq6Q9ODbNnR"
  projects.json: "{\"projects\":[{\"ingestKeys\":[\"83pQ3o0BreGFGzkHozbA2LMLm1LGmcqg\"],\"name\":\"us\",\"readKeys\":[\"bP6rjPBYPgws7V1qEJZ4AUPgVLjvvyc4\"]},{\"ingestKeys\":[\"hyVGIrUtMy5LZusd0S4dfBvShLwihYF6\"],\"name\":\"eu\",\"readKeys\":[\"aoeD1P4Yi9Y4SaZV3q2ATtq6Q9ODbNnR\"]}]}"
