apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: telemetry-ingest-and-query-gke
spec:
  cluster: hub
  description: >
    What the Coroot agents send reaches ClickHouse and comes back through the
    project-scoped read API: remote-write metrics (with a counter that resets),
    OTLP/JSON traces with hex ids, logs, and a pprof profile. Each check reads
    only the rows its own run wrote. The test data goes into the real project
    (TI_PROJECT) under names that start with chainsaw (metric chainsaw_ti_connects_total,
    service chainsaw-cart); retention removes it. Isolation between two projects
    needs a second project (TI_OTHER_PROJECT); with one, that step reports it was
    skipped.
  steps:
  - name: send metrics, traces, logs and a profile
    try:
    - script:
        timeout: 2m
        content: |
          bash "${TI_HELPERS:?run through make validate-telemetry-ingest-gke}/checks.sh" ingest_all
  - name: metrics keep labels, values and millisecond times, and rates survive a counter reset
    try:
    - script:
        timeout: 2m
        content: |
          bash "${TI_HELPERS}/checks.sh" check_metrics
  - name: traces are stored with their ids and searchable
    try:
    - script:
        timeout: 2m
        content: |
          bash "${TI_HELPERS}/checks.sh" check_traces
  - name: logs are searchable by severity, text and trace
    try:
    - script:
        timeout: 2m
        content: |
          bash "${TI_HELPERS}/checks.sh" check_logs
  - name: the profile is served as top stacks and folded text
    try:
    - script:
        timeout: 2m
        content: |
          bash "${TI_HELPERS}/checks.sh" check_profiles
  - name: a second project cannot see this project's data (skipped with one project)
    try:
    - script:
        timeout: 2m
        content: |
          bash "${TI_HELPERS}/checks.sh" check_isolation
